<title>paalhn — messages</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF; --ink:#1A1A1A;
    --graphite:#8C8C87; --line:#E9E8E4;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    background:var(--paper); color:var(--ink);
    font-family:'Inter', sans-serif;
  }
  .wrap{ width:100%; max-width:820px; margin:0 auto; padding:56px 24px; }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:22px; margin:0 0 4px;
  }
  .sub{ color:var(--graphite); font-size:13.5px; margin:0 0 36px; }
  h1:empty{ display:none; }
  .sub:empty{ display:none; margin:0; }

  .gate{
    max-width:300px;
    display:grid; gap:14px;
  }
  .gate input{
    font-family:'Inter', sans-serif;
    font-size:14px; padding:8px 0;
    background:transparent; border:none; border-bottom:1px solid var(--line);
    outline:none;
  }
  .gate input:focus{ border-color:var(--ink); }
  .gate button{
    font-family:'Inter', sans-serif;
    font-size:13px; letter-spacing:0.02em;
    background:var(--ink); color:var(--paper); border:none;
    border-radius:2px; padding:11px 18px; cursor:pointer;
  }
  .gate button:hover{ opacity:0.8; }
  .err{ color:#B23A2E; font-size:12.5px; min-height:16px; }

  .toolbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:20px; gap:12px; flex-wrap:wrap;
  }
  .count{ font-size:12.5px; color:var(--graphite); }
  .actions{ display:flex; gap:18px; }
  .btn{
    font-family:'Inter', sans-serif; font-size:12.5px;
    letter-spacing:0.02em;
    background:transparent; color:var(--graphite);
    border:none; border-bottom:1px solid var(--line);
    padding:0 0 2px; cursor:pointer;
  }
  .btn:hover{ color:var(--ink); border-color:var(--ink); }
  .btn.primary{ color:var(--ink); font-weight:500; }
  .btn.primary:hover{ color:var(--ink); border-color:var(--ink); }

  .menu-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:14px;
  }
  .menu-tile{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
    text-align:left;
    background:transparent;
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px 18px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    transition:border-color .15s, background-color .15s;
  }
  .menu-tile:hover{ border-color:var(--ink); background:rgba(26,26,26,0.02); }
  .menu-tile .tile-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:15px;
    color:var(--ink);
  }
  .menu-tile .tile-sub{ font-size:12px; color:var(--graphite); }
  .menu-tile.placeholder{
    cursor:default;
    border-style:dashed;
  }
  .menu-tile.placeholder:hover{ border-color:var(--line); background:none; }
  .menu-tile.placeholder .tile-title{ color:var(--graphite); }

  .back-link{
    display:inline-block;
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    color:var(--graphite);
    background:none;
    border:none;
    padding:0;
    margin-bottom:24px;
    cursor:pointer;
  }
  .back-link:hover{ color:var(--ink); }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td{ text-align:left; padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{
    font-size:11px;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--graphite);
    font-weight:500;
  }
  td.msg{ max-width:340px; white-space:pre-wrap; }
  td.time{ font-size:12px; color:var(--graphite); white-space:nowrap; }

  #app{ display:none; }

  /* ================= taask tracker ================= */
  :root{
    --taask-head:#434343;
    --taask-green:#2E7D32;
    --taask-green-soft:#E7F4E8;
    --taask-maroon:#8B2E28;
    --taask-cancelled:#6B7280;
    --taask-grid:#E2E2DE;
    --taask-border:#D3D1C6;
    --taask-auto-bg:#F0F0EC;
    --taask-cols: 30px 38px 48px 72px 66px 100px 100px minmax(150px,1.3fr) minmax(150px,1.5fr) 116px;
    --taask-zoom: 1;
  }
  #view-taask{ display:none; }
  .taask-wrap{
    width:100%;
    max-width:1320px;
    margin:0 auto;
    padding:56px 24px 80px;
  }

  .taask-settings{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:20px 32px;
    margin-bottom:22px;
    padding:10px 0 14px;
    position:sticky;
    top:0;
    z-index:40;
    background:var(--paper);
  }
  .taask-settings-left{ display:flex; flex-direction:column; gap:8px; }
  .taask-settings-mid{ display:flex; flex-direction:column; gap:8px; }

  /* toggle-pill style controls — label + select widths are fixed per pair so
     stacked pills line up exactly (same color break point, same arrow position) */
  .taask-pill{
    display:flex;
    align-items:stretch;
    border-radius:4px;
    overflow:hidden;
    border:1px solid var(--taask-border);
  }
  .taask-pill-label{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12px;
    color:#fff;
    background:var(--taask-head);
    padding:7px 12px;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:6px;
    box-sizing:border-box;
  }
  .taask-settings-left .taask-pill-label{ width:128px; }
  .taask-settings-mid .taask-pill-label{ width:74px; }
  .taask-pill select{
    appearance:none;
    -webkit-appearance:none;
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:12.5px;
    color:var(--ink);
    background:#fff url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%226%22 viewBox=%220 0 10 6%22%3E%3Cpath d=%22M1 1l4 4 4-4%22 stroke=%22%23434343%22 stroke-width=%221.4%22 fill=%22none%22/%3E%3C/svg%3E') no-repeat right 10px center;
    border:none;
    padding:7px 26px 7px 12px;
    box-sizing:border-box;
    cursor:pointer;
  }
  .taask-settings-left .taask-pill select{ width:148px; }
  .taask-settings-mid .taask-pill select{ width:132px; }
  .taask-pill.pill-zoom{ border-color:#2864C4; }
  .taask-pill.pill-zoom .taask-pill-label{ background:#2864C4; }
  .taask-pill.pill-sort{ border-color:#2E7D32; }
  .taask-pill.pill-sort .taask-pill-label{ background:#2E7D32; }

  .taask-filters{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
  }
  .taask-filter{ display:flex; flex-direction:column; gap:4px; }
  .taask-filter label{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:11px;
    color:var(--ink);
  }
  .taask-filter input{
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    padding:6px 8px;
    border:1px solid var(--taask-border);
    border-radius:3px;
  }
  .taask-filter-range{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--graphite);
  }
  .taask-filter-range input{ min-width:120px; }
  #taskFilter{ min-width:170px; }

  .taask-zoomwrap{ zoom:var(--taask-zoom); }
  .taask-tagrow{
    display:grid;
    grid-template-columns:var(--taask-cols);
    margin-bottom:2px;
    position:sticky;
    z-index:32;
    background:var(--paper);
  }
  .taask-tagrow span{
    font-family:'Inter', sans-serif;
    font-size:9px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--graphite);
  }

  .taask-table{
    border:1px solid var(--ink);
    border-radius:4px;
  }
  .taask-headrow, .taask-row{
    display:grid;
    grid-template-columns:var(--taask-cols);
    align-items:stretch;
  }
  .taask-headrow{
    position:sticky;
    z-index:31;
    border-bottom:2px solid var(--ink);
  }
  .taask-headrow > div{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:10px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:#fff;
    background:var(--taask-head);
    padding:6px 6px;
    display:flex;
    align-items:center;
    white-space:nowrap;
  }
  .taask-headrow > div:first-child{ border-top-left-radius:3px; }
  .taask-headrow > div.col-auto{
    color:var(--ink) !important;
    background:#fff !important;
  }
  .taask-headrow > div.col-auto:last-of-type{
    border-right:1px solid var(--ink);
  }
  .taask-headrow > div.col-center{ justify-content:center; text-align:center; }

  .taask-row{
    border-bottom:1px solid var(--taask-grid);
    background:#fff;
  }
  .taask-row:hover{ background:#FAFAF8; }
  .taask-row.is-dimmed{ opacity:0.42; }
  .taask-row.dragging{ opacity:0.35; }
  .taask-row.drag-over{ border-top:2px solid var(--taask-head); }
  .taask-row[draggable="true"]{ cursor:grab; }
  .taask-row > div{
    padding:5px 6px;
    font-family:'Inter', sans-serif;
    font-size:12px;
    display:flex;
    align-items:center;
    min-width:0;
  }
  .taask-cell-check{ justify-content:center; }
  .taask-cell-id{
    color:var(--ink);
    font-size:11.5px;
    font-weight:600;
    background:var(--taask-auto-bg);
    justify-content:center;
    text-align:center;
  }
  .taask-cell-readonly{
    color:var(--ink);
    font-size:11.5px;
    background:var(--taask-auto-bg);
    justify-content:center;
    text-align:center;
  }
  .taask-cell-readonly:last-of-type{ border-right:1px solid var(--taask-grid); }

  .taask-row input[type="text"],
  .taask-row input[type="date"]{
    width:100%;
    border:none;
    background:transparent;
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--ink);
    padding:2px;
  }
  .taask-row input[type="text"]:focus,
  .taask-row input[type="date"]:focus{
    outline:1.5px solid var(--taask-head);
    outline-offset:1px;
    background:#fff;
  }
  .taask-cell-deadline{ position:relative; justify-content:center; }
  .taask-cell-deadline input[type="date"]{ text-align:center; color:var(--ink); }
  .taask-cell-deadline input[type="date"].is-empty:not(:focus){ color:transparent; }
  .taask-cell-deadline input[type="date"]:focus{ color:var(--ink) !important; }
  .taask-cell-deadline input:focus ~ .deadline-tag{ display:none; }
  .taask-cell-deadline .deadline-tag{
    position:absolute;
    left:0; right:18px; top:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:#B7B5AC;
    font-style:italic;
    pointer-events:none;
  }

  .taask-cell-status{ justify-content:center; }
  .taask-row select.status-select{
    width:100%;
    border:1px solid var(--taask-grid);
    border-radius:3px;
    background:#fff;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:11px;
    padding:3px 4px;
    cursor:pointer;
    text-align:center;
    text-align-last:center;
  }
  select.status-select.st-ongoing{ color:var(--taask-maroon); }
  select.status-select.st-completed{ color:var(--taask-green); }
  select.status-select.st-notstarted{ color:var(--graphite); }
  select.status-select.st-cancelled{ color:var(--taask-cancelled); font-style:italic; }

  .taask-check{
    color:var(--taask-green);
    font-weight:700;
    font-size:14px;
    opacity:0;
    transform:scale(0.3);
  }
  .taask-check.show{ opacity:1; transform:scale(1); }
  .taask-check.pop{
    animation:taaskCheckPop .55s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes taaskCheckPop{
    0%{ opacity:0; transform:scale(0.2) rotate(-15deg); }
    60%{ opacity:1; transform:scale(1.25) rotate(4deg); }
    100%{ opacity:1; transform:scale(1) rotate(0); }
  }

  .taask-row.flash-complete{
    animation:taaskFlash 1.1s ease;
  }
  @keyframes taaskFlash{
    0%{ background:var(--taask-green-soft); }
    70%{ background:var(--taask-green-soft); }
    100%{ background:#fff; }
  }
  .taask-row.fade-out{
    animation:taaskFadeOut .45s ease forwards;
  }
  @keyframes taaskFadeOut{
    from{ opacity:1; max-height:60px; }
    to{ opacity:0; max-height:0; padding-top:0; padding-bottom:0; }
  }

  .taask-row.is-blank input::placeholder{ color:#B7B5AC; font-style:italic; }

  .taask-rowactions{
    display:flex;
    align-items:center;
    gap:10px;
    margin:16px 0 0;
    flex-wrap:wrap;
  }
  .taask-addrows, .taask-delrow, .taask-savebtn, .taask-exportbtn{
    display:block;
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:12.5px;
    background:#fff;
    color:var(--ink);
    border:1px solid var(--taask-border);
    border-radius:4px;
    padding:8px 18px;
    cursor:pointer;
  }
  .taask-savebtn{ background:var(--taask-green); color:#fff; border-color:var(--taask-green); font-weight:600; }
  .taask-savebtn:hover{ background:#256A29; }
  .taask-addrows:hover, .taask-delrow:hover, .taask-exportbtn:hover{ border-color:var(--ink); }
  .taask-delrow:disabled{ opacity:0.4; cursor:default; }
  .taask-delrow:disabled:hover{ border-color:var(--taask-border); }
  .taask-savestatus{
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--taask-green);
    opacity:0;
    transition:opacity .2s ease;
  }
  .taask-savestatus.show{ opacity:1; }

  @media (prefers-reduced-motion: reduce){
    .taask-check.pop, .taask-row.flash-complete, .taask-row.fade-out{ animation:none !important; }
  }

  @media (max-width:1100px){
    :root{ --taask-cols: 26px 32px 42px 62px 56px 84px 78px minmax(120px,1.2fr) minmax(120px,1.4fr) 100px; }
    .taask-row > div, .taask-headrow > div{ padding:5px 4px; font-size:11px; }
  }
  @media (max-width:760px){
    :root{ --taask-cols: 22px 28px 36px 50px 44px 72px 64px minmax(90px,1.2fr) minmax(90px,1.4fr) 86px; }
    .taask-row > div{ padding:4px 3px; font-size:10.5px; }
    .taask-headrow > div{ font-size:9px; padding:5px 3px; }
    select.status-select{ font-size:9.5px; padding:3px 2px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1></h1>
  <p class="sub"></p>

  <div class="gate" id="gate">
    <input type="password" id="pw" placeholder="Password" autocomplete="off">
    <button id="unlock">Unlock</button>
    <div class="err" id="err"></div>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="menu-grid">
      <button class="menu-tile" id="tileMessages" type="button">
        <span class="tile-title">Messages</span>
        <span class="tile-sub" id="tileMessagesSub">Contact form submissions</span>
      </button>
      <button class="menu-tile" id="tileTaask" type="button">
        <span class="tile-title">taask</span>
        <span class="tile-sub" id="tileTaaskSub">Task tracker</span>
      </button>
      <div class="menu-tile placeholder">
        <span class="tile-title">&middot;&middot;&middot;</span>
        <span class="tile-sub">Coming soon</span>
      </div>
    </div>
  </div>

  <div id="app">
    <button class="back-link" id="backBtn" type="button">&larr; Dashboard</button>
    <div class="toolbar">
      <span class="count" id="count"></span>
      <div class="actions">
        <button class="btn" id="refreshBtn">Refresh</button>
        <button class="btn primary" id="csvBtn">Download CSV</button>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>Time</th><th>Name</th><th>Email</th><th>Message</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div id="view-taask">
  <div class="taask-wrap">
    <button class="back-link" id="backBtnTaask" type="button">&larr; Dashboard</button>

    <div class="taask-settings">
      <div class="taask-settings-left">
        <div class="taask-pill">
          <span class="taask-pill-label">Hide Completed</span>
          <select id="hideCompleted">
            <option value="OFF">OFF</option>
            <option value="ON">ON</option>
          </select>
        </div>
        <div class="taask-pill">
          <span class="taask-pill-label">Dim Ongoing</span>
          <select id="dimOngoing">
            <option value="OFF">OFF</option>
            <option value="ON">ON</option>
          </select>
        </div>
      </div>

      <div class="taask-settings-mid">
        <div class="taask-pill pill-zoom">
          <span class="taask-pill-label">&#128269; Zoom</span>
          <select id="taaskZoom">
            <option value="0.85">85%</option>
            <option value="1" selected>100%</option>
            <option value="1.15">115%</option>
            <option value="1.3">130%</option>
          </select>
        </div>
        <div class="taask-pill pill-sort">
          <span class="taask-pill-label">Sort</span>
          <select id="taaskSort">
            <option value="date">Date</option>
            <option value="daysleft">Days Left</option>
            <option value="status">Status</option>
            <option value="category">Category</option>
            <option value="task">Task</option>
            <option value="manual">Manual (drag to reorder)</option>
          </select>
        </div>
      </div>

      <div class="taask-filters">
        <div class="taask-filter">
          <label>Date Filter</label>
          <div class="taask-filter-range">
            <input type="date" id="dateFilterFrom" title="From">
            <span>&ndash;</span>
            <input type="date" id="dateFilterTo" title="To">

        </div>
        <div class="taask-filter">
          <label for="taskFilter">Task Filter</label>
          <input type="text" id="taskFilter" placeholder="Search tasks…">
        </div>
      </div>
    </div>

    <div class="taask-zoomwrap" id="taaskOuter">
      <div class="taask-tagrow">
        <span></span>
        <span></span>
        <span>Autofills</span>
        <span>Autofills</span>
        <span>Autofills</span>
      </div>
      <div class="taask-table">
        <div class="taask-headrow">
          <div></div>
          <div class="col-center col-auto">#</div>
          <div class="col-center col-auto">Week</div>
          <div class="col-center col-auto">Weekday</div>
          <div class="col-center col-auto">Days Left</div>
          <div class="col-center">Deadline</div>
          <div>Category</div>
          <div>Task</div>
          <div>Notes</div>
          <div class="col-center">Status</div>
        </div>
        <div class="taask-body" id="taaskBody"></div>
      </div>
    </div>

    <div class="taask-rowactions">
      <button class="taask-addrows" id="addRowsBtn" type="button">+ Add 1 row</button>
      <button class="taask-delrow" id="delRowBtn" type="button">Delete 1 row</button>
      <button class="taask-savebtn" id="saveBtn" type="button">Save</button>
      <button class="taask-exportbtn" id="exportCsvBtn" type="button">Export CSV</button>
      <span class="taask-savestatus" id="saveStatus">Saved ✓</span>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const gate = document.getElementById('gate');
const dashboard = document.getElementById('dashboard');
const app = document.getElementById('app');
const errEl = document.getElementById('err');
const pwInput = document.getElementById('pw');
let currentData = [];
let currentKey = '';

async function fetchMessages(key){
  errEl.textContent = '';
  if (APPS_SCRIPT_URL.includes('PASTE_YOUR')) {
    errEl.textContent = 'Not connected yet — see setup notes.';
    return;
  }
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (data.error) {
      errEl.textContent = 'Incorrect password.';
      return;
    }
    currentData = data.rows || [];
    currentKey = key;
    render();
    gate.style.display = 'none';
    dashboard.style.display = 'block';
  } catch (err) {
    errEl.textContent = 'Could not reach the server. Try again.';
  }
}

function render(){
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  currentData.slice().reverse().forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="time">${escapeHtml(row.timestamp || '')}</td>
      <td>${escapeHtml(row.name || '')}</td>
      <td>${escapeHtml(row.email || '')}</td>
      <td class="msg">${escapeHtml(row.message || '')}</td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById('count').textContent = `${currentData.length} message${currentData.length === 1 ? '' : 's'}`;
  document.getElementById('tileMessagesSub').textContent = `${currentData.length} message${currentData.length === 1 ? '' : 's'}`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function toCsv(rows){
  const header = ['timestamp','name','email','message'];
  const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [header.join(',')];
  rows.forEach(r => {
    lines.push(header.map(h => esc(r[h])).join(','));
  });
  return lines.join('\n');
}

document.getElementById('unlock').addEventListener('click', () => fetchMessages(pwInput.value));
pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchMessages(pwInput.value); });

document.getElementById('tileMessages').addEventListener('click', () => {
  dashboard.style.display = 'none';
  app.style.display = 'block';
});

document.getElementById('backBtn').addEventListener('click', () => {
  app.style.display = 'none';
  dashboard.style.display = 'block';
});

document.getElementById('refreshBtn').addEventListener('click', () => fetchMessages(currentKey));

document.getElementById('csvBtn').addEventListener('click', () => {
  const csv = toCsv(currentData);
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `paalhn-messages-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

/* ================================================================
   taask — task tracker
   ================================================================ */
const viewTaask = document.getElementById('view-taask');
const taaskBody = document.getElementById('taaskBody');
let currentTasks = [];
let taaskLoaded = false;
let blankCounter = 0;
let dragSrcId = null;

document.getElementById('tileTaask').addEventListener('click', async () => {
  dashboard.style.display = 'none';
  viewTaask.style.display = 'block';
  if (!taaskLoaded) {
    taaskBody.innerHTML = '<div style="padding:16px;color:var(--graphite);font-size:13px;">Loading tasks…</div>';
    await fetchTasks();
  }
});

document.getElementById('backBtnTaask').addEventListener('click', () => {
  viewTaask.style.display = 'none';
  dashboard.style.display = 'block';
});

function makeBlankTask(){
  blankCounter++;
  return { id: 'local-' + blankCounter, deadline: '', category: '', task: '', notes: '', status: 'NOT STARTED', saved: false };
}

function ensureMinRows(min){
  while (currentTasks.length < min) currentTasks.push(makeBlankTask());
}

async function fetchTasks(){
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?key=${encodeURIComponent(currentKey)}&resource=tasks`);
    const data = await res.json();
    if (data.error) {
      taaskBody.innerHTML = '<div style="padding:16px;color:var(--graphite);font-size:13px;">Could not load tasks.</div>';
      return;
    }
    // everything that comes back from the Sheet is already persisted —
    // this is what makes tasks available across devices/sessions
    currentTasks = (data.tasks || []).map(t => ({ ...t, saved: true }));
    ensureMinRows(25);
    taaskLoaded = true;
    renderTaask();
  } catch (err) {
    taaskBody.innerHTML = '<div style="padding:16px;color:var(--graphite);font-size:13px;">Could not reach the server.</div>';
  }
}

async function taaskApi(payload){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ key: currentKey, ...payload })
  });
  return res.json();
}

/* ---- autofill: Week / Weekday / Days Left, derived from Deadline ---- */
function getISOWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
}

function toDateOnly(value){
  if (!value) return null;
  let d;
  if (value instanceof Date) {
    d = new Date(value.getFullYear(), value.getMonth(), value.getDate());
  } else {
    const s = String(value).slice(0, 10);
    d = new Date(s + 'T00:00:00');
  }
  return isNaN(d.getTime()) ? null : d;
}

function autofillFromDeadline(deadlineVal){
  const d = toDateOnly(deadlineVal);
  if (!d) return { week: '–', weekday: '–', daysLeft: '–', daysLeftNum: null };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diffDays = Math.round((d - today) / 86400000);
  return {
    week: getISOWeek(d),
    weekday: d.toLocaleDateString('en-US', { weekday: 'long' }),
    daysLeft: diffDays,
    daysLeftNum: diffDays
  };
}

// Builds a local "YYYY-MM-DD" key without ever converting through UTC —
// toISOString() would shift the date by a day for anyone east of UTC.
function deadlineKey(t){
  const d = toDateOnly(t.deadline);
  if (!d) return null;
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

/* ---- render ---- */
function renderTaask(){
  const hideCompleted = document.getElementById('hideCompleted').value === 'ON';
  const dimOngoing = document.getElementById('dimOngoing').value === 'ON';
  const sortBy = document.getElementById('taaskSort').value;
  const zoomVal = document.getElementById('taaskZoom').value;
  const dateFrom = document.getElementById('dateFilterFrom').value;
  const dateTo = document.getElementById('dateFilterTo').value;
  const taskFilter = document.getElementById('taskFilter').value.trim().toLowerCase();

  document.getElementById('taaskOuter').style.setProperty('--taask-zoom', zoomVal);

  const filtersActive = !!(dateFrom || dateTo || taskFilter);

  const saved = currentTasks.filter(t => t.saved);
  const blank = currentTasks.filter(t => !t.saved);

  let list = saved.slice();

  // a row mid-completion animation stays visible for its grace window even if
  // Hide Completed is on, so the checkmark/flash/sound always gets to play
  if (hideCompleted) list = list.filter(t => t._justCompleted || (t.status || '').trim().toUpperCase() !== 'COMPLETED');
  if (dateFrom) list = list.filter(t => { const k = deadlineKey(t); return k && k >= dateFrom; });
  if (dateTo) list = list.filter(t => { const k = deadlineKey(t); return k && k <= dateTo; });
  if (taskFilter) list = list.filter(t => (t.task || '').toLowerCase().includes(taskFilter));

  if (sortBy !== 'manual') {
    list.sort((a, b) => {
      if (sortBy === 'date') return (deadlineKey(a) || '9999-99-99').localeCompare(deadlineKey(b) || '9999-99-99');
      if (sortBy === 'daysleft') {
        const da = autofillFromDeadline(a.deadline).daysLeftNum;
        const db = autofillFromDeadline(b.deadline).daysLeftNum;
        const va = da === null ? Infinity : da;
        const vb = db === null ? Infinity : db;
        return va - vb;
      }
      if (sortBy === 'status') return (a.status || '').localeCompare(b.status || '');
      if (sortBy === 'category') return (a.category || '').localeCompare(b.category || '');
      if (sortBy === 'task') return (a.task || '').localeCompare(b.task || '');
      return 0;
    });
  }
  // sortBy === 'manual' → keep currentTasks' existing order (drag-and-drop sets this)

  // blank entry rows are only shown when nothing is being actively filtered/searched
  const finalList = filtersActive ? list : list.concat(blank);

  taaskBody.innerHTML = '';
  finalList.forEach((t, i) => {
    taaskBody.appendChild(buildTaskRow(t, dimOngoing, i + 1));
  });

  alignSticky();

  const savedCount = saved.length;
  document.getElementById('tileTaaskSub').textContent = `${savedCount} task${savedCount === 1 ? '' : 's'}`;
  document.getElementById('delRowBtn').disabled = blank.length === 0;

  if (filtersActive && finalList.length === 0) {
    taaskBody.innerHTML = '<div style="padding:16px;color:var(--graphite);font-size:13px;">No tasks match this filter.</div>';
  }
}

function alignSticky(){
  requestAnimationFrame(() => {
    const settings = document.querySelector('.taask-settings');
    const tagrow = document.querySelector('.taask-tagrow');
    const headrow = document.querySelector('.taask-headrow');
    const settingsH = settings ? settings.offsetHeight : 0;
    const tagrowH = tagrow ? tagrow.offsetHeight : 0;
    if (tagrow) tagrow.style.top = settingsH + 'px';
    if (headrow) headrow.style.top = (settingsH + tagrowH) + 'px';
  });
}

function statusClassFor(status){
  const s = (status || '').toUpperCase();
  if (s === 'COMPLETED') return 'st-completed';
  if (s === 'ONGOING') return 'st-ongoing';
  if (s === 'CANCELLED') return 'st-cancelled';
  return 'st-notstarted';
}

function buildTaskRow(task, dimOngoing, displayId){
  const row = document.createElement('div');
  row.className = 'taask-row' + (task.saved ? '' : ' is-blank');
  row.dataset.id = task.id;
  const status = (task.status || 'NOT STARTED').toUpperCase();
  if (dimOngoing && status === 'ONGOING') row.classList.add('is-dimmed');

  const auto = autofillFromDeadline(task.deadline);
  const hasDeadline = !!task.deadline;

  row.innerHTML = `
    <div class="taask-cell-check"><span class="taask-check ${status === 'COMPLETED' ? 'show' : ''}">&#10004;</span></div>
    <div class="taask-cell-id">${displayId}</div>
    <div class="taask-cell-readonly">${auto.week}</div>
    <div class="taask-cell-readonly">${auto.weekday}</div>
    <div class="taask-cell-readonly">${auto.daysLeft}</div>
    <div class="taask-cell-deadline">
      <input type="date" class="f-deadline ${hasDeadline ? '' : 'is-empty'}" value="${task.deadline || ''}">
      ${hasDeadline ? '' : '<span class="deadline-tag">Date</span>'}
    </div>
    <div><input type="text" class="f-category" value="${escapeHtml(task.category || '')}" placeholder="Category"></div>
    <div><input type="text" class="f-task" value="${escapeHtml(task.task || '')}" placeholder="${task.saved ? 'Untitled task' : '+ New task…'}"></div>
    <div><input type="text" class="f-notes" value="${escapeHtml(task.notes || '')}" placeholder="Notes"></div>
    <div class="taask-cell-status">
      <select class="status-select ${statusClassFor(status)}">
        <option value="NOT STARTED"${status === 'NOT STARTED' ? ' selected' : ''}>NOT STARTED</option>
        <option value="ONGOING"${status === 'ONGOING' ? ' selected' : ''}>ONGOING</option>
        <option value="COMPLETED"${status === 'COMPLETED' ? ' selected' : ''}>COMPLETED</option>
        <option value="CANCELLED"${status === 'CANCELLED' ? ' selected' : ''}>CANCELLED</option>
      </select>
    </div>
  `;

  row.querySelector('.f-deadline').addEventListener('change', (e) => handleFieldChange(task, 'deadline', e.target.value, row, true));
  row.querySelector('.f-category').addEventListener('blur', (e) => handleFieldChange(task, 'category', e.target.value, row));
  row.querySelector('.f-task').addEventListener('blur', (e) => handleFieldChange(task, 'task', e.target.value, row));
  row.querySelector('.f-notes').addEventListener('blur', (e) => handleFieldChange(task, 'notes', e.target.value, row));

  row.querySelector('.f-task').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') e.target.blur();
  });

  const statusSelect = row.querySelector('.status-select');
  statusSelect.addEventListener('change', (e) => handleStatusChange(task, e.target.value, row, statusSelect));

  // drag-and-drop reordering — only saved rows are draggable
  if (task.saved) {
    row.draggable = true;
    row.addEventListener('dragstart', () => {
      dragSrcId = task.id;
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.classList.remove('drag-over');
      if (!dragSrcId || dragSrcId === task.id) return;
      const fromIdx = currentTasks.findIndex(t => t.id === dragSrcId);
      const toIdx = currentTasks.findIndex(t => t.id === task.id);
      if (fromIdx === -1 || toIdx === -1) return;
      const [moved] = currentTasks.splice(fromIdx, 1);
      currentTasks.splice(toIdx, 0, moved);
      dragSrcId = null;
      document.getElementById('taaskSort').value = 'manual';
      renderTaask();
    });
  }

  return row;
}

/* ---- field edits: promotes a blank row to a saved task on first meaningful edit ---- */
async function handleFieldChange(task, field, value, rowEl, refresh){
  if (task[field] === value) { if (refresh) renderTaask(); return; }
  task[field] = value;

  if (!task.saved) {
    if (!task.task || !task.task.trim()) {
      if (refresh) renderTaask();
      return; // don't save a row until it at least has a task name
    }
    const result = await taaskApi({
      action: 'addTask',
      deadline: task.deadline,
      category: task.category,
      task: task.task,
      notes: task.notes,
      status: task.status
    });
    if (result.ok) {
      task.id = result.id;
      task.saved = true;
      ensureMinRows(currentTasks.filter(t => t.saved).length + 5);
    }
    renderTaask();
    return;
  }

  await taaskApi({ action: 'updateTask', id: task.id, [field]: value });
  if (refresh) renderTaask();
}

/*
 * Hide Completed logic: when a task's status changes to COMPLETED, the row
 * always plays the checkmark pop + green flash + chime, regardless of the
 * Hide Completed setting. If Hide Completed is ON, the row is additionally
 * marked _justCompleted so it survives one grace window (900ms) — long enough
 * for the animation to finish — before a re-render filters it out for real.
 * Toggling Hide Completed OFF at any time simply stops excluding COMPLETED
 * rows from the render list, so previously-hidden tasks reappear immediately.
 */
async function handleStatusChange(task, newStatus, rowEl, selectEl){
  const prevStatus = (task.status || '').toUpperCase();
  task.status = newStatus;
  selectEl.className = 'status-select ' + statusClassFor(newStatus);

  if (!task.saved) {
    if (!task.task || !task.task.trim()) return; // nothing to save yet
    const result = await taaskApi({
      action: 'addTask',
      deadline: task.deadline, category: task.category, task: task.task, notes: task.notes, status: newStatus
    });
    if (result.ok) { task.id = result.id; task.saved = true; }
  } else {
    await taaskApi({ action: 'updateTask', id: task.id, status: newStatus });
  }

  if (newStatus === 'COMPLETED' && prevStatus !== 'COMPLETED') {
    const checkEl = rowEl.querySelector('.taask-check');
    if (checkEl) checkEl.classList.add('show', 'pop');
    rowEl.classList.add('flash-complete');
    playHappyChime();

    const hideCompleted = document.getElementById('hideCompleted').value === 'ON';
    if (hideCompleted) {
      // _justCompleted is ONLY ever set alongside its own clearing timeout,
      // so it can never get stuck true and permanently bypass the filter.
      task._justCompleted = true;
      setTimeout(() => {
        task._justCompleted = false;
        renderTaask();
      }, 900);
    }
  } else if (newStatus !== 'COMPLETED') {
    task._justCompleted = false;
    const checkEl = rowEl.querySelector('.taask-check');
    if (checkEl) checkEl.classList.remove('show', 'pop');
  }
}

document.getElementById('addRowsBtn').addEventListener('click', () => {
  currentTasks.push(makeBlankTask());
  renderTaask();
});

document.getElementById('delRowBtn').addEventListener('click', () => {
  // only ever removes an empty/unsaved row — never touches real task data
  for (let i = currentTasks.length - 1; i >= 0; i--) {
    if (!currentTasks[i].saved) {
      currentTasks.splice(i, 1);
      renderTaask();
      return;
    }
  }
});

/* ---- manual Save: everything already auto-saves on blur/change, this is a
   visible confirmation + a safety net for anything that didn't get a chance
   to blur yet (e.g. you typed a task name then clicked Save immediately) ---- */
async function saveAllTasks(){
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = 'Saving…';
  statusEl.classList.add('show');

  if (document.activeElement && typeof document.activeElement.blur === 'function') {
    document.activeElement.blur();
    await new Promise(r => setTimeout(r, 250)); // let that blur's auto-save land
  }

  const pending = currentTasks.filter(t => !t.saved && t.task && t.task.trim());
  for (const task of pending) {
    const result = await taaskApi({
      action: 'addTask',
      deadline: task.deadline, category: task.category, task: task.task, notes: task.notes, status: task.status
    });
    if (result.ok) { task.id = result.id; task.saved = true; }
  }
  if (pending.length) renderTaask();

  statusEl.textContent = 'Saved ✓';
  setTimeout(() => statusEl.classList.remove('show'), 2000);
}
document.getElementById('saveBtn').addEventListener('click', saveAllTasks);

/* ---- export visible, saved tasks as CSV ---- */
function exportTasksCsv(){
  const header = ['deadline', 'category', 'task', 'notes', 'status'];
  const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = currentTasks.filter(t => t.saved).map(t => header.map(h => esc(t[h])).join(','));
  const csv = [header.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `taask-export-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
document.getElementById('exportCsvBtn').addEventListener('click', exportTasksCsv);

/* ---- happy completion chime (Web Audio, no files) ---- */
let taaskAudioCtx = null;
function playHappyChime(){
  try {
    if (!taaskAudioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      taaskAudioCtx = new AC();
    }
    if (taaskAudioCtx.state === 'suspended') taaskAudioCtx.resume();
    const notes = [523.25, 659.25, 783.99]; // C5, E5, G5 — a small happy arpeggio
    notes.forEach((freq, i) => {
      const t0 = taaskAudioCtx.currentTime + i * 0.09;
      const osc = taaskAudioCtx.createOscillator();
      const gain = taaskAudioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.13, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
      osc.connect(gain).connect(taaskAudioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.4);
    });
  } catch (err) { /* audio not available — fail silently */ }
}

/* ---- settings/filter/sort/zoom wiring ---- */
['hideCompleted', 'dimOngoing', 'taaskSort', 'taaskZoom'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderTaask);
});
document.getElementById('dateFilterFrom').addEventListener('change', renderTaask);
document.getElementById('dateFilterTo').addEventListener('change', renderTaask);
document.getElementById('taskFilter').addEventListener('input', renderTaask);
window.addEventListener('resize', () => { if (taaskLoaded) alignSticky(); });
</script></body>
